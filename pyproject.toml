[project]
name = "i-love-people"
version = "0.1.0"
description = "Private meetup journal and gentle catch-up reminders"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pywebpush==2.5.0",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "distlib==0.4.4",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ilp"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/reference", ".tools", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/ilp", "scripts", "backend/tests"]

[tool.uv]
package = true

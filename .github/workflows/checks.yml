name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run --locked python scripts/tasks.py db-start
      - run: uv run --locked python scripts/tasks.py db-check
      - if: always()
        run: uv run --locked python scripts/tasks.py db-stop
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run --locked python scripts/tasks.py check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-review
          path: |
            artifacts/local/
            test-results/
          retention-days: 7
